<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajesh Hotel - Vizag's Best</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#FFF8F0}
header{background:#B71C1C;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.cart-btn{background:white;color:#B71C1C;border:none;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.hero{background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=800');background-size:cover;color:white;padding:60px 20px;text-align:center}
.menu{max-width:900px;margin:-30px auto 0;background:white;border-radius:20px 20px 0 0;padding:25px;box-shadow:0 -5px 20px rgba(0,0,0,0.1)}
.menu h3{font-size:24px;margin-bottom:20px;border-left:5px solid #B71C1C;padding-left:10px}
.item{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #eee}
.item-info h4{text-transform:capitalize;font-size:18px}
.price{font-weight:700;color:#B71C1C;font-size:18px;margin-right:15px}
.add-btn{background:#B71C1C;color:white;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:600}
.cart-panel{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #B71C1C;padding:15px 20px;box-shadow:0 -5px 20px rgba(0,0,0,0.1);transform:translateY(100%);transition:0.3s;z-index:200}
.cart-panel.open{transform:translateY(0)}
.cart-item{display:flex;justify-content:space-between;margin:10px 0}
.order-btn{width:100%;background:#2E7D32;color:white;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:700;margin-top:15px;cursor:pointer}
</style>
</head>
<body>
<header>
<div><h1>RAJESH HOTEL</h1><span style="font-size:12px">Vizag • Since 2024</span></div>
<button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>
<div class="hero">
<h2>Authentic Andhra Taste</h2>
<p>7 Special Items - Freshly Made</p>
</div>
<div class="menu">
<h3>Today's Menu</h3>
<div id="menuList"></div>
</div>
<div class="cart-panel" id="cartPanel">
<h3>Your Order</h3>
<div id="cartItems">Cart is empty</div>
<div style="margin-top:15px;display:flex;justify-content:space-between;font-weight:700;font-size:18px">
<span>Total:</span><span>Rs.<span id="total">0</span></span>
</div>
<input id="custName" placeholder="Your Name" style="width:100%;padding:12px;margin-top:15px;border:1px solid #ddd;border-radius:8px">
<input id="custPhone" placeholder="Phone Number" style="width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px">
<button class="order-btn" onclick="placeOrder()">Place Order - COD</button>
<div id="status" style="margin-top:10px;text-align:center;font-weight:600"></div>
</div>
<script>
const API_BASE = "https://rajesh-hotel.onrender.com";
const menu = [
  {id:1,name:"biryani",price:250,desc:"Hyderabadi Dum Biryani"},
  {id:2,name:"cocacola",price:60,desc:"Chilled 300ml"},
  {id:4,name:"apricot delight",price:150,desc:"Special Sweet"},
  {id:5,name:"rasmalai",price:150,desc:"Soft & Juicy - 2 Pcs"},
  {id:6,name:"jaamkai",price:100,desc:"Traditional Pickle"},
  {id:7,name:"vaamkai",price:20,desc:"Fresh Snack"},
  {id:8,name:"mutton biryani",price:450,desc:"Premium Mutton"}
];
let cart = [];
function renderMenu(){
  document.getElementById('menuList').innerHTML = menu.map(m=>`
    <div class="item">
      <div class="item-info"><h4>${m.name}</h4><p>${m.desc}</p></div>
      <div style="display:flex;align-items:center"><span class="price">₹${m.price}</span><button class="add-btn" onclick="addToCart(${m.id})">ADD</button></div>
    </div>
  `).join('');
}
function addToCart(id){
  const item = menu.find(x=>x.id===id);
  const ex = cart.find(x=>x.id===id);
  if(ex) ex.qty++; else cart.push({...item,qty:1});
  updateCart(); document.getElementById('cartPanel').classList.add('open');
}
function updateCart(){
  document.getElementById('count').innerText = cart.reduce((a,b)=>a+b.qty,0);
  document.getElementById('total').innerText = cart.reduce((a,b)=>a+(b.price*b.qty),0);
  if(cart.length===0){ document.getElementById('cartItems').innerHTML="Cart is empty"; return; }
  document.getElementById('cartItems').innerHTML = cart.map(c=>`
    <div class="cart-item"><span>${c.name} x ${c.qty}</span><span>₹${c.price*c.qty} <button onclick="removeItem(${c.id})" style="border:none;background:none;color:red">✕</button></span></div>
  `).join('');
}
function removeItem(id){ cart=cart.filter(x=>x.id!==id); updateCart(); }
function toggleCart(){ document.getElementById('cartPanel').classList.toggle('open'); }
async function placeOrder(){
  const name=document.getElementById('custName').value;
  const phone=document.getElementById('custPhone').value;
  if(!name||!phone){ alert("Name & Phone pettu!"); return; }
  document.getElementById('status').innerText="Order chesthunna... ⏳";
  try{
    for(let c of cart){
      await fetch(`${API_BASE}/order`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_name:name,phone:phone,item_name:c.name,quantity:c.qty,price:c.price})});
    }
    document.getElementById('status').innerText="✅ Order Success!";
    cart=[]; updateCart();
  }catch(e){ document.getElementById('status').innerText="❌ Error"; }
}
renderMenu();
</script>
</body>
</html>
